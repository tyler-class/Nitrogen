name: Nitrogen index
description: Reindex a Nitrogen notes repo with the full parser and post rows to the Worker; optionally mirror a standard-markdown copy.
branding: { icon: book-open, color: green }
inputs:
  worker-url:
    description: Base URL of the Nitrogen Worker (vars.NITROGEN_URL)
    required: true
  ingest-secret:
    description: HMAC secret shared with the Worker (secrets.NITROGEN_INGEST_SECRET)
    required: true
  lint:
    description: Fail the job when pages have lint errors
    default: 'false'
  mirror-branch:
    description: If set (e.g. "standard"), push a normalized copy of the vault to this branch
    default: ''
  mirror-profile:
    description: gfm or commonmark
    default: gfm
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with: { node-version: 22 }
    - name: Lint
      if: inputs.lint == 'true'
      shell: bash
      run: node "${{ github.action_path }}/dist/nitrogen.mjs" lint --root "${{ github.workspace }}" --errors-only
    - name: Index
      shell: bash
      env:
        NITROGEN_INGEST_SECRET: ${{ inputs.ingest-secret }}
      run: node "${{ github.action_path }}/dist/nitrogen.mjs" index --root "${{ github.workspace }}" --post "${{ inputs.worker-url }}"
    - name: Mirror standard markdown
      if: inputs.mirror-branch != ''
      shell: bash
      run: |
        set -euo pipefail
        out="$(mktemp -d)"
        node "${{ github.action_path }}/dist/nitrogen.mjs" export --root "${{ github.workspace }}" --out "$out" --profile "${{ inputs.mirror-profile }}"
        cd "$out"
        git init -q -b "${{ inputs.mirror-branch }}"
        git config user.name "nitrogen-bot"
        git config user.email "nitrogen-bot@users.noreply.github.com"
        git add -A
        git commit -q -m "Standard markdown mirror of ${GITHUB_SHA}"
        git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${{ inputs.mirror-branch }}"
