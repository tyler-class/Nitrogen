# Optional: keep a normalized standard-markdown copy of the vault on the `standard` branch.
name: nitrogen-standard-mirror
on:
  push: { branches: [main] }
  workflow_dispatch: {}
permissions: { contents: write }
jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: tyler-class/nitrogen/action@v0
        with:
          worker-url: ${{ vars.NITROGEN_URL }}
          ingest-secret: ${{ secrets.NITROGEN_INGEST_SECRET }}
          mirror-branch: standard
          mirror-profile: gfm
